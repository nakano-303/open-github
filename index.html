<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キラキラこんにちは</title>
    <style>
        /* 背景のデザイン */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff0f6; /* 薄いピンク */
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            cursor: pointer;
        }

        /* 文字のデザインとアニメーション */
        h1 {
            color: #ff85a2;
            font-size: 3rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            animation: fuwafuwa 3s ease-in-out infinite; /* ふわふわ動く */
            user-select: none;
        }

        @keyframes fuwafuwa {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        /* 飛び出す絵文字のスタイル */
        .emoji-particle {
            position: absolute;
            pointer-events: none;
            font-size: 1.5rem;
            animation: fly 1s ease-out forwards;
        }

        @keyframes fly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>こんにちは ✨</h1>

    <script>
        // 画面をクリックした時に絵文字を出す
        document.addEventListener('click', (e) => {
            const emojis = ['🌸', '✨', '💖', '🎀', '🐥', '🍬'];
            
            // 一度に5個の絵文字を出す
            for (let i = 0; i < 5; i++) {
                const span = document.createElement('span');
                span.className = 'emoji-particle';
                span.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                
                // クリックした位置に配置
                span.style.left = e.clientX + 'px';
                span.style.top = e.clientY + 'px';
                
                // 飛び散る方向をランダムに設定
                const x = (Math.random() - 0.5) * 200 + 'px';
                const y = (Math.random() - 0.5) * 200 + 'px';
                span.style.setProperty('--x', x);
                span.style.setProperty('--y', y);
                
                document.body.appendChild(span);
                
                // アニメーションが終わったら削除
                setTimeout(() => {
                    span.remove();
                }, 1000);
            }
        });
    </script>
</body>
</html>
